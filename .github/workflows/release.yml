name: Release ThemeSwitch (Guaranteed Upload)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

env:
  TZ: Asia/Tehran
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.ver }}-${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ===== IPK BUILDS =====
          - platform: x86_64
            url_sdk: https://downloads.openwrt.org/snapshots/targets/x86/64/openwrt-sdk-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            ver: "ipk"
          - platform: aarch64_generic
            url_sdk: https://downloads.openwrt.org/snapshots/targets/rockchip/armv8/openwrt-sdk-rockchip-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            ver: "ipk"
          - platform: aarch64_cortex-a53
            url_sdk: https://downloads.openwrt.org/snapshots/targets/mvebu/cortexa53/openwrt-sdk-mvebu-cortexa53_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            ver: "ipk"
          - platform: aarch64_cortex-a72
            url_sdk: https://downloads.openwrt.org/snapshots/targets/mvebu/cortexa72/openwrt-sdk-mvebu-cortexa72_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            ver: "ipk"
          - platform: arm_cortex-a5_vfpv4
            url_sdk: https://downloads.openwrt.org/snapshots/targets/at91/sama5/openwrt-sdk-at91-sama5_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst
            ver: "ipk"
          - platform: arm_cortex-a7
            url_sdk: https://downloads.openwrt.org/snapshots/targets/mediatek/mt7629/openwrt-sdk-mediatek-mt7629_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst
            ver: "ipk"
          - platform: arm_cortex-a7_neon-vfpv4
            url_sdk: https://downloads.openwrt.org/snapshots/targets/sunxi/cortexa7/openwrt-sdk-sunxi-cortexa7_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst
            ver: "ipk"
          - platform: arm_cortex-a8_vfpv3
            url_sdk: https://downloads.openwrt.org/snapshots/targets/sunxi/cortexa8/openwrt-sdk-sunxi-cortexa8_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst
            ver: "ipk"
          - platform: arm_cortex-a9
            url_sdk: https://downloads.openwrt.org/snapshots/targets/bcm53xx/generic/openwrt-sdk-bcm53xx-generic_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst
            ver: "ipk"
          - platform: arm_cortex-a9_neon
            url_sdk: https://downloads.openwrt.org/snapshots/targets/zynq/generic/openwrt-sdk-zynq-generic_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst
            ver: "ipk"
          - platform: arm_cortex-a9_vfpv3-d16
            url_sdk: https://downloads.openwrt.org/snapshots/targets/mvebu/cortexa9/openwrt-sdk-mvebu-cortexa9_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst
            ver: "ipk"
          - platform: arm_cortex-a15_neon-vfpv4
            url_sdk: https://downloads.openwrt.org/snapshots/targets/ipq806x/generic/openwrt-sdk-ipq806x-generic_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst
            ver: "ipk"
          - platform: mips_24kc
            url_sdk: https://downloads.openwrt.org/snapshots/targets/ath79/generic/openwrt-sdk-ath79-generic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            ver: "ipk"
          - platform: mips_4kec
            url_sdk: https://downloads.openwrt.org/snapshots/targets/realtek/rtl838x/openwrt-sdk-realtek-rtl838x_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            ver: "ipk"
          - platform: mips_mips32
            url_sdk: https://downloads.openwrt.org/snapshots/targets/bcm53xx/generic/openwrt-sdk-bcm53xx-generic_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst
            ver: "ipk"
          - platform: mipsel_24kc
            url_sdk: https://downloads.openwrt.org/snapshots/targets/ramips/rt288x/openwrt-sdk-ramips-rt288x_gcc-14.2.0_musl.Linux-x86_64.tar.zst
            ver: "ipk"
          - platform: mipsel_74kc
            url_sdk: https://downloads.openwrt.org/snapshots/targets/ramips/rt3883/openwrt-sdk-ramips-rt3883_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            ver: "ipk"
          - platform: mipsel_mips32
            url_sdk: https://downloads.openwrt.org/snapshots/targets/bcm47xx/generic/openwrt-sdk-bcm47xx-generic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            ver: "ipk"

          # ===== APK BUILDS =====
          - platform: x86_64
            url_sdk: https://downloads.openwrt.org/snapshots/targets/x86/64/openwrt-sdk-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            ver: "apk"
          - platform: aarch64_generic
            url_sdk: https://downloads.openwrt.org/snapshots/targets/rockchip/armv8/openwrt-sdk-rockchip-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            ver: "apk"
          - platform: aarch64_cortex-a53
            url_sdk: https://downloads.openwrt.org/snapshots/targets/mvebu/cortexa53/openwrt-sdk-mvebu-cortexa53_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            ver: "apk"
          - platform: aarch64_cortex-a72
            url_sdk: https://downloads.openwrt.org/snapshots/targets/mvebu/cortexa72/openwrt-sdk-mvebu-cortexa72_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            ver: "apk"
          - platform: arm_cortex-a5_vfpv4
            url_sdk: https://downloads.openwrt.org/snapshots/targets/at91/sama5/openwrt-sdk-at91-sama5_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst
            ver: "apk"
          - platform: arm_cortex-a7
            url_sdk: https://downloads.openwrt.org/snapshots/targets/mediatek/mt7629/openwrt-sdk-mediatek-mt7629_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst
            ver: "apk"
          - platform: arm_cortex-a7_neon-vfpv4
            url_sdk: https://downloads.openwrt.org/snapshots/targets/sunxi/cortexa7/openwrt-sdk-sunxi-cortexa7_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst
            ver: "apk"
          - platform: arm_cortex-a8_vfpv3
            url_sdk: https://downloads.openwrt.org/snapshots/targets/sunxi/cortexa8/openwrt-sdk-sunxi-cortexa8_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst
            ver: "apk"
          - platform: arm_cortex-a9
            url_sdk: https://downloads.openwrt.org/snapshots/targets/bcm53xx/generic/openwrt-sdk-bcm53xx-generic_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst
            ver: "apk"
          - platform: arm_cortex-a9_neon
            url_sdk: https://downloads.openwrt.org/snapshots/targets/zynq/generic/openwrt-sdk-zynq-generic_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst
            ver: "apk"
          - platform: arm_cortex-a9_vfpv3-d16
            url_sdk: https://downloads.openwrt.org/snapshots/targets/mvebu/cortexa9/openwrt-sdk-mvebu-cortexa9_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst
            ver: "apk"
          - platform: arm_cortex-a15_neon-vfpv4
            url_sdk: https://downloads.openwrt.org/snapshots/targets/ipq806x/generic/openwrt-sdk-ipq806x-generic_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst
            ver: "apk"
          - platform: mips_24kc
            url_sdk: https://downloads.openwrt.org/snapshots/targets/ath79/generic/openwrt-sdk-ath79-generic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            ver: "apk"
          - platform: mips_4kec
            url_sdk: https://downloads.openwrt.org/snapshots/targets/realtek/rtl838x/openwrt-sdk-realtek-rtl838x_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            ver: "apk"
          - platform: mips_mips32
            url_sdk: https://downloads.openwrt.org/snapshots/targets/bcm53xx/generic/openwrt-sdk-bcm53xx-generic_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst
            ver: "apk"
          - platform: mipsel_24kc
            url_sdk: https://downloads.openwrt.org/snapshots/targets/ramips/rt288x/openwrt-sdk-ramips-rt288x_gcc-14.2.0_musl.Linux-x86_64.tar.zst
            ver: "apk"
          - platform: mipsel_74kc
            url_sdk: https://downloads.openwrt.org/snapshots/targets/ramips/rt3883/openwrt-sdk-ramips-rt3883_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            ver: "apk"
          - platform: mipsel_mips32
            url_sdk: https://downloads.openwrt.org/snapshots/targets/bcm47xx/generic/openwrt-sdk-bcm47xx-generic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            ver: "apk"

    steps:
      - uses: actions/checkout@v4
      
      - name: Clone Source & Extract Version
        id: get_version
        run: |
          mkdir -p src_projects
          git clone https://github.com/peditx/luci-app-themeswitch.git src_projects/luci-app-themeswitch
          VER=$(grep '^PKG_RELEASE' src_projects/luci-app-themeswitch/Makefile | awk -F ':=' '{print $2}' | tr -d ' \n\r')
          [ -z "$VER" ] && VER="1.0.5"
          echo "version=v$VER" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git gettext unzip zlib1g-dev file python3 curl wget zstd python3-pyelftools

      - name: Download & Setup SDK
        run: |
          wget ${{ matrix.url_sdk }} -O sdk.tar.zst
          mkdir sdk && tar --use-compress-program=unzstd -xf sdk.tar.zst -C sdk --strip-components=1
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install luci

      - name: Configure & Compile (${{ matrix.ver }})
        run: |
          # Use absolute local path inside current runner directory
          mkdir -p ${{ github.workspace }}/output_packages
          
          cd sdk
          mkdir -p package/luci-app-themeswitch
          cp -r ../src_projects/luci-app-themeswitch/* package/luci-app-themeswitch/
          
          make defconfig
          
          if [ "${{ matrix.ver }}" == "apk" ]; then
            echo "CONFIG_USE_APK=y" >> .config
            echo "CONFIG_OPKG=n" >> .config
          else
            echo "CONFIG_USE_APK=n" >> .config
            echo "CONFIG_OPKG=y" >> .config
          fi
          
          echo -e "CONFIG_PACKAGE_luci-app-themeswitch=m\nCONFIG_LUCI_JSMIN=n\nCONFIG_LUCI_CSSTIDY=n" >> .config
          
          # Force compile without masking errors to ensure it really generated the file
          make package/luci-app-themeswitch/compile -j$(nproc) V=s
          
          # Look for the true compiled extensions inside the SDK output folder
          FOUND_FILE=$(find bin/ -type f \( -name "*.ipk" -o -name "*.apk" \) -name "*themeswitch*")
          
          if [ -z "$FOUND_FILE" ]; then
            echo "❌ CRITICAL: Compilation finished successfully but output package file was NOT found!"
            exit 1
          fi
          
          # Dynamic rename and move to local absolute directory
          echo "Found compiled asset: $FOUND_FILE"
          cp "$FOUND_FILE" "${{ github.workspace }}/output_packages/luci-app-themeswitch-${{ steps.get_version.outputs.version }}-${{ matrix.platform }}.${matrix.ver}"
          
          echo "=== Verified Output Directory ==="
          ls -la ${{ github.workspace }}/output_packages/

      - name: Save Version File
        if: matrix.platform == 'x86_64' && matrix.ver == 'ipk'
        run: echo "${{ steps.get_version.outputs.version }}" > ${{ github.workspace }}/output_packages/version.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: themeswitch-${{ matrix.ver }}-${{ matrix.platform }}
          path: ${{ github.workspace }}/output_packages/
          retention-days: 1
          if-no-files-found: error

  release:
    name: Create Unified Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all-assets
          merge-multiple: true

      - name: Read Version
        id: rel_ver
        run: |
          VER=$(cat all-assets/version.txt 2>/dev/null || echo "v1.0.5")
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel_ver.outputs.version }}
          name: "ThemeSwitch ${{ steps.rel_ver.outputs.version }}"
          files: |
            all-assets/luci-app-themeswitch-*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
