name: Release ThemeSwitch (Multi-Arch)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

env:
  TZ: Asia/Tehran
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    name: Extract Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_ver.outputs.version }}
    steps:
      - name: Clone Source to Read Version
        run: |
          git clone https://github.com/peditx/luci-app-themeswitch.git src
          
      - name: Get Version from Makefile
        id: get_ver
        run: |
          VERSION=$(grep -E 'PKG_VERSION\s*:=\s*' src/Makefile | sed -E 's/PKG_VERSION\s*:=\s*//' | tr -d ' \n\r')
          if [ -z "$VERSION" ]; then VERSION="1.0.0"; fi
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
          echo "🏷️ Detected Version: v$VERSION"

  build:
    name: Build ${{ matrix.arch }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64_generic
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - arm_cortex-a5_vfpv4
          - arm_cortex-a7
          - arm_cortex-a7_neon-vfpv4
          - arm_cortex-a8_vfpv3
          - arm_cortex-a9
          - arm_cortex-a9_neon
          - arm_cortex-a9_vfpv3-d16
          - arm_cortex-a15_neon-vfpv4
          - mips_24kc
          - mips_4kec
          - mips_mips32
          - mipsel_24kc
          - mipsel_74kc
          - mipsel_mips32

    steps:
      - name: Checkout Target Repo
        uses: actions/checkout@v4
        
      - name: Clone ThemeSwitch Source
        run: |
          mkdir -p src_projects
          git clone https://github.com/peditx/luci-app-themeswitch.git src_projects/luci-app-themeswitch

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git gettext unzip zlib1g-dev file python3 curl wget zstd

      # ================= BUILD IPK (SDK 23.05) =================
      - name: Build IPK (${{ matrix.arch }})
        run: |
          SDK_URL="http://downloads.openwrt.org/releases/23.05.0/targets/${{ matrix.arch }}/generic/openwrt-sdk-23.05.0-${{ matrix.arch }}_gcc-12.3.0_musl.Linux-x86_64.tar.xz"
          if ! wget -q --spider "$SDK_URL"; then
            echo "⚠️ IPK SDK not found for ${{ matrix.arch }}"
            exit 0
          fi
          wget "$SDK_URL" -O sdk_ipk.tar.xz
          mkdir -p sdk_ipk && tar -xJf sdk_ipk.tar.xz -C sdk_ipk --strip-components=1
          cd sdk_ipk
          ./scripts/feeds update -a && ./scripts/feeds install -a
          
          mkdir -p package/luci-app-themeswitch
          cp -r ../src_projects/luci-app-themeswitch/* package/luci-app-themeswitch/
          
          echo -e "CONFIG_PACKAGE_luci-app-themeswitch=m\nCONFIG_LUCI_JSMIN=n\nCONFIG_LUCI_CSSTIDY=n" >> .config
          make defconfig
          make package/luci-app-themeswitch/compile -j$(nproc) V=s || true
          
          mkdir -p ../artifacts/ipk
          find bin/ -type f \( -iname "luci-app-themeswitch_*.ipk" -o -iname "luci-app-themeswitch-*.ipk" \) -exec cp {} ../artifacts/ipk/ \; 2>/dev/null || true

      # ================= BUILD APK (SDK 25.12) =================
      - name: Build APK (${{ matrix.arch }})
        run: |
          SDK_URL="http://downloads.openwrt.org/releases/25.12.0/targets/${{ matrix.arch }}/generic/openwrt-sdk-25.12.0-${{ matrix.arch }}_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          if ! wget -q --spider "$SDK_URL"; then
            echo "⚠️ APK SDK not found for ${{ matrix.arch }}"
            exit 0
          fi
          wget "$SDK_URL" -O sdk_apk.tar.zst
          mkdir -p sdk_apk
          tar --use-compress-program=unzstd -xf sdk_apk.tar.zst -C sdk_apk --strip-components=1
          
          cd sdk_apk
          ./scripts/feeds update -a && ./scripts/feeds install -a
          
          mkdir -p package/luci-app-themeswitch
          cp -r ../src_projects/luci-app-themeswitch/* package/luci-app-themeswitch/
          
          echo -e "CONFIG_PACKAGE_luci-app-themeswitch=m\nCONFIG_LUCI_JSMIN=n\nCONFIG_LUCI_CSSTIDY=n" >> .config
          make defconfig
          make package/luci-app-themeswitch/compile -j$(nproc) V=s || true
          
          mkdir -p ../artifacts/apk
          find bin/ -type f \( -iname "luci-app-themeswitch_*.apk" -o -iname "luci-app-themeswitch-*.apk" \) -exec cp {} ../artifacts/apk/ \; 2>/dev/null || true

      # ================= UPLOAD ARTIFACTS =================
      - name: Upload Build Artifacts
        if: hashFiles('artifacts/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: themeswitch-${{ matrix.arch }}
          path: artifacts/
          retention-days: 1

  release:
    name: Create Unified Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-assets
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        if: hashFiles('all-assets/**') != ''
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: "ThemeSwitch ${{ needs.prepare.outputs.version }}"
          files: all-assets/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
