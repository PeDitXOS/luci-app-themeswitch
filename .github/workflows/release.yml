name: Release ThemeSwitch (Passwall Style Matrix)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

env:
  TZ: Asia/Tehran
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    name: Extract Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_ver.outputs.version }}
    steps:
      - run: git clone https://github.com/peditx/luci-app-themeswitch.git src
      - id: get_ver
        run: |
          VERSION=$(grep -E 'PKG_VERSION\s*:=\s*' src/Makefile | sed -E 's/PKG_VERSION\s*:=\s*//' | tr -d ' \n\r')
          [ -z "$VERSION" ] && VERSION="1.0.0"
          echo "version=v$VERSION" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.ver }}-${{ matrix.platform }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ===== IPK BUILDS (24.10.0 STABLE) =====
          - platform: x86_64
            url_sdk: http://downloads.openwrt.org/releases/24.10.0/targets/x86/64/openwrt-sdk-24.10.0-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            ver: "ipk"
          - platform: aarch64_generic
            url_sdk: http://downloads.openwrt.org/releases/24.10.0/targets/armsr/armv8/openwrt-sdk-24.10.0-armsr-armv8_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            ver: "ipk"
          - platform: aarch64_cortex-a53
            url_sdk: http://downloads.openwrt.org/releases/24.10.0/targets/bcm27xx/bcm2710/openwrt-sdk-24.10.0-bcm27xx-bcm2710_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            ver: "ipk"
          - platform: aarch64_cortex-a72
            url_sdk: http://downloads.openwrt.org/releases/24.10.0/targets/bcm27xx/bcm2711/openwrt-sdk-24.10.0-bcm27xx-bcm2711_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            ver: "ipk"
          - platform: arm_cortex-a5_vfpv4
            url_sdk: http://downloads.openwrt.org/releases/24.10.0/targets/at91/sama5/openwrt-sdk-24.10.0-at91-sama5_gcc-13.3.0_musl_eabi.Linux-x86_64.tar.zst
            ver: "ipk"
          - platform: arm_cortex-a7
            url_sdk: http://downloads.openwrt.org/releases/24.10.0/targets/sunxi/cortexa7/openwrt-sdk-24.10.0-sunxi-cortexa7_gcc-13.3.0_musl_eabi.Linux-x86_64.tar.zst
            ver: "ipk"
          - platform: arm_cortex-a7_neon-vfpv4
            url_sdk: http://downloads.openwrt.org/releases/24.10.0/targets/ipq40xx/generic/openwrt-sdk-24.10.0-ipq40xx-generic_gcc-13.3.0_musl_eabi.Linux-x86_64.tar.zst
            ver: "ipk"
          - platform: arm_cortex-a8_vfpv3
            url_sdk: http://downloads.openwrt.org/releases/24.10.0/targets/sunxi/cortexa8/openwrt-sdk-24.10.0-sunxi-cortexa8_gcc-13.3.0_musl_eabi.Linux-x86_64.tar.zst
            ver: "ipk"
          - platform: arm_cortex-a9
            url_sdk: http://downloads.openwrt.org/releases/24.10.0/targets/mvebu/cortexa9/openwrt-sdk-24.10.0-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64.tar.zst
            ver: "ipk"
          - platform: arm_cortex-a9_neon
            url_sdk: http://downloads.openwrt.org/releases/24.10.0/targets/imx/cortexa9/openwrt-sdk-24.10.0-imx-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64.tar.zst
            ver: "ipk"
          - platform: arm_cortex-a9_vfpv3-d16
            url_sdk: http://downloads.openwrt.org/releases/24.10.0/targets/kirkwood/generic/openwrt-sdk-24.10.0-kirkwood-generic_gcc-13.3.0_musl_eabi.Linux-x86_64.tar.zst
            ver: "ipk"
          - platform: arm_cortex-a15_neon-vfpv4
            url_sdk: http://downloads.openwrt.org/releases/24.10.0/targets/ipq806x/generic/openwrt-sdk-24.10.0-ipq806x-generic_gcc-13.3.0_musl_eabi.Linux-x86_64.tar.zst
            ver: "ipk"
          - platform: mips_24kc
            url_sdk: http://downloads.openwrt.org/releases/24.10.0/targets/ath79/generic/openwrt-sdk-24.10.0-ath79-generic_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            ver: "ipk"
          - platform: mips_4kec
            url_sdk: http://downloads.openwrt.org/releases/24.10.0/targets/ramips/mt7620/openwrt-sdk-24.10.0-ramips-mt7620_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            ver: "ipk"
          - platform: mips_mips32
            url_sdk: http://downloads.openwrt.org/releases/24.10.0/targets/bcm47xx/generic/openwrt-sdk-24.10.0-bcm47xx-generic_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            ver: "ipk"
          - platform: mipsel_24kc
            url_sdk: http://downloads.openwrt.org/releases/24.10.0/targets/ramips/mt7621/openwrt-sdk-24.10.0-ramips-mt7621_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            ver: "ipk"
          - platform: mipsel_74kc
            url_sdk: http://downloads.openwrt.org/releases/24.10.0/targets/ramips/rt3883/openwrt-sdk-24.10.0-ramips-rt3883_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            ver: "ipk"
          - platform: mipsel_mips32
            url_sdk: http://downloads.openwrt.org/releases/24.10.0/targets/bcm47xx/generic/openwrt-sdk-24.10.0-bcm47xx-generic_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            ver: "ipk"

          # ===== APK BUILDS (25.12.0 RELEASE) =====
          - platform: x86_64
            url_sdk: http://downloads.openwrt.org/releases/25.12.0/targets/x86/64/openwrt-sdk-25.12.0-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            ver: "apk"
          - platform: aarch64_generic
            url_sdk: http://downloads.openwrt.org/releases/25.12.0/targets/armsr/armv8/openwrt-sdk-25.12.0-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            ver: "apk"
          - platform: aarch64_cortex-a53
            url_sdk: http://downloads.openwrt.org/releases/25.12.0/targets/bcm27xx/bcm2710/openwrt-sdk-25.12.0-bcm27xx-bcm2710_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            ver: "apk"
          - platform: aarch64_cortex-a72
            url_sdk: http://downloads.openwrt.org/releases/25.12.0/targets/bcm27xx/bcm2711/openwrt-sdk-25.12.0-bcm27xx-bcm2711_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            ver: "apk"
          - platform: arm_cortex-a5_vfpv4
            url_sdk: http://downloads.openwrt.org/releases/25.12.0/targets/at91/sama5/openwrt-sdk-25.12.0-at91-sama5_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst
            ver: "apk"
          - platform: arm_cortex-a7
            url_sdk: http://downloads.openwrt.org/releases/25.12.0/targets/sunxi/cortexa7/openwrt-sdk-25.12.0-sunxi-cortexa7_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst
            ver: "apk"
          - platform: arm_cortex-a7_neon-vfpv4
            url_sdk: http://downloads.openwrt.org/releases/25.12.0/targets/ipq40xx/generic/openwrt-sdk-25.12.0-ipq40xx-generic_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst
            ver: "apk"
          - platform: arm_cortex-a8_vfpv3
            url_sdk: http://downloads.openwrt.org/releases/25.12.0/targets/sunxi/cortexa8/openwrt-sdk-25.12.0-sunxi-cortexa8_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst
            ver: "apk"
          - platform: arm_cortex-a9
            url_sdk: http://downloads.openwrt.org/releases/25.12.0/targets/mvebu/cortexa9/openwrt-sdk-25.12.0-mvebu-cortexa9_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst
            ver: "apk"
          - platform: arm_cortex-a9_neon
            url_sdk: http://downloads.openwrt.org/releases/25.12.0/targets/imx/cortexa9/openwrt-sdk-25.12.0-imx-cortexa9_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst
            ver: "apk"
          - platform: arm_cortex-a9_vfpv3-d16
            url_sdk: http://downloads.openwrt.org/releases/25.12.0/targets/kirkwood/generic/openwrt-sdk-25.12.0-kirkwood-generic_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst
            ver: "apk"
          - platform: arm_cortex-a15_neon-vfpv4
            url_sdk: http://downloads.openwrt.org/releases/25.12.0/targets/ipq806x/generic/openwrt-sdk-25.12.0-ipq806x-generic_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst
            ver: "apk"
          - platform: mips_24kc
            url_sdk: http://downloads.openwrt.org/releases/25.12.0/targets/ath79/generic/openwrt-sdk-25.12.0-ath79-generic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            ver: "apk"
          - platform: mips_4kec
            url_sdk: http://downloads.openwrt.org/releases/25.12.0/targets/ramips/mt7620/openwrt-sdk-25.12.0-ramips-mt7620_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            ver: "apk"
          - platform: mips_mips32
            url_sdk: http://downloads.openwrt.org/releases/25.12.0/targets/bcm47xx/generic/openwrt-sdk-25.12.0-bcm47xx-generic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            ver: "apk"
          - platform: mipsel_24kc
            url_sdk: http://downloads.openwrt.org/releases/25.12.0/targets/ramips/mt7621/openwrt-sdk-25.12.0-ramips-mt7621_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            ver: "apk"
          - platform: mipsel_74kc
            url_sdk: http://downloads.openwrt.org/releases/25.12.0/targets/ramips/rt3883/openwrt-sdk-25.12.0-ramips-rt3883_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            ver: "apk"
          - platform: mipsel_mips32
            url_sdk: http://downloads.openwrt.org/releases/25.12.0/targets/bcm47xx/generic/openwrt-sdk-25.12.0-bcm47xx-generic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            ver: "apk"

    steps:
      - uses: actions/checkout@v4
      - name: Clone Source
        run: |
          mkdir -p src_projects
          git clone https://github.com/peditx/luci-app-themeswitch.git src_projects/luci-app-themeswitch

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git gettext unzip zlib1g-dev file python3 curl wget zstd

      - name: Download & Setup SDK
        run: |
          wget ${{ matrix.url_sdk }} -O sdk.tar.zst
          mkdir sdk && tar --use-compress-program=unzstd -xf sdk.tar.zst -C sdk --strip-components=1
          cd sdk
          ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: Configure & Compile (${{ matrix.ver }})
        run: |
          cd sdk
          mkdir -p package/luci-app-themeswitch
          cp -r ../src_projects/luci-app-themeswitch/* package/luci-app-themeswitch/
          
          echo -e "CONFIG_PACKAGE_luci-app-themeswitch=m\nCONFIG_LUCI_JSMIN=n\nCONFIG_LUCI_CSSTIDY=n" >> .config
          make defconfig
          make package/luci-app-themeswitch/compile -j$(nproc) V=s || true
          
          mkdir -p ../artifacts/${{ matrix.ver }}
          if [ "${{ matrix.ver }}" == "ipk" ]; then
            find bin/ -type f \( -iname "luci-app-themeswitch_*.ipk" -o -iname "luci-app-themeswitch-*.ipk" \) -exec cp {} ../artifacts/ipk/ \; 2>/dev/null || true
          else
            find bin/ -type f \( -iname "luci-app-themeswitch_*.apk" -o -iname "luci-app-themeswitch-*.apk" \) -exec cp {} ../artifacts/apk/ \; 2>/dev/null || true
          fi

      - uses: actions/upload-artifact@v4
        if: hashFiles('artifacts/**') != ''
        with:
          name: themeswitch-${{ matrix.ver }}-${{ matrix.platform }}
          path: artifacts/
          retention-days: 1

  release:
    name: Create Unified Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all-assets
          merge-multiple: true
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        if: hashFiles('all-assets/**') != ''
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: "ThemeSwitch ${{ needs.prepare.outputs.version }}"
          files: all-assets/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
