name: Test Single APK Build ThemeSwitch

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Asia/Tehran
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Test Build x86_64-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Clone Source & Extract Version
        id: get_version
        run: |
          mkdir -p src_projects
          git clone https://github.com/peditx/luci-app-themeswitch.git src_projects/luci-app-themeswitch
          VER=$(grep '^PKG_RELEASE' src_projects/luci-app-themeswitch/Makefile | awk -F ':=' '{print $2}' | tr -d ' \n\r')
          [ -z "$VER" ] && VER="1.0.5"
          echo "version=v$VER" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git gettext unzip zlib1g-dev file python3 curl wget zstd python3-pyelftools

      - name: Download & Setup SDK
        run: |
          wget https://downloads.openwrt.org/snapshots/targets/x86/64/openwrt-sdk-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst -O sdk.tar.zst
          mkdir sdk && tar --use-compress-program=unzstd -xf sdk.tar.zst -C sdk --strip-components=1
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install luci

      - name: Configure & Compile
        run: |
          mkdir -p ${{ github.workspace }}/output_packages
          
          cd sdk
          mkdir -p package/luci-app-themeswitch
          cp -r ../src_projects/luci-app-themeswitch/* package/luci-app-themeswitch/
          
          make defconfig
          echo "CONFIG_USE_APK=y" >> .config
          echo "CONFIG_OPKG=n" >> .config
          echo -e "CONFIG_PACKAGE_luci-app-themeswitch=m\nCONFIG_LUCI_JSMIN=n\nCONFIG_LUCI_CSSTIDY=n" >> .config
          
          make package/luci-app-themeswitch/compile -j$(nproc) V=s IGNORE_ERRORS=m
          
          FOUND_FILE=$(find bin/ -type f \( -name "*.ipk" -o -name "*.apk" \) -name "*themeswitch*")
          if [ -z "$FOUND_FILE" ]; then
            echo "❌ CRITICAL: Package file was NOT found in bin/ targets!"
            exit 1
          fi
          
          echo "Found compiled asset: $FOUND_FILE"
          ext="${FOUND_FILE##*.}"
          cp "$FOUND_FILE" "${{ github.workspace }}/output_packages/luci-app-themeswitch-${{ steps.get_version.outputs.version }}-x86_64-test.${ext}"
          
          echo "=== Verified Output Directory ==="
          ls -la ${{ github.workspace }}/output_packages/

      - name: Save Version File
        run: echo "${{ steps.get_version.outputs.version }}" > ${{ github.workspace }}/output_packages/version.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: themeswitch-test-apk-x86_64
          path: ${{ github.workspace }}/output_packages/
          retention-days: 1
          if-no-files-found: error

  release:
    name: Create Test Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all-assets
          merge-multiple: true

      - name: Read Version
        id: rel_ver
        run: |
          VER=$(cat all-assets/version.txt 2>/dev/null || echo "v1.0.5")
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel_ver.outputs.version }}
          name: "ThemeSwitch Test APK Build ${{ steps.rel_ver.outputs.version }}"
          files: |
            all-assets/luci-app-themeswitch-*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
